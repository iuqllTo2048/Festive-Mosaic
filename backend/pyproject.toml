[project]
name = "verifyatlas-backend"
version = "0.1.0"
description = "VerifiAtlas local PDF evidence workspace"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pypdf>=6,<8",
    "python-multipart>=0.0.20,<1",
    "pydantic-settings>=2.9,<3",
    "httpx>=0.28,<1",
    "rank-bm25>=0.2.2,<0.3",
    "openai>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
